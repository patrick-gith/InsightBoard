name: Keep Render Alive

on:
  schedule:
    # Toutes les 5 minutes — sous le seuil d'inactivité de Render (~15 min)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render via /health/
        run: |
          MAX_ATTEMPTS=3
          URL="https://insightboard-fev0.onrender.com/health/"

          for i in $(seq 1 $MAX_ATTEMPTS); do
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              --max-time 45 \
              "$URL" || echo "000")

            echo "Tentative $i/$MAX_ATTEMPTS → HTTP $CODE"
            if [ -f /tmp/resp.json ]; then
              cat /tmp/resp.json
              echo ""
            fi

            if [ "$CODE" = "200" ]; then
              echo "✅ Render est éveillé"
              exit 0
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              echo "⏳ Attente 10s avant nouvelle tentative…"
              sleep 10
            fi
          done

          echo "⚠️ Health check en échec après $MAX_ATTEMPTS tentatives"
          echo "   Render est probablement en cold start ou en cours de redéploiement."
          exit 0   # ne pas faire échouer le workflow