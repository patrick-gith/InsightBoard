<div class="kpi-card group relative overflow-hidden
            rounded-2xl p-5 sm:p-6
            bg-white dark:bg-gray-900
            border border-gray-200 dark:border-gray-800
            shadow-sm hover:shadow-xl
            hover:-translate-y-1
            hover:ring-2 {{ ring }}
            transition-all duration-300
            min-h-[140px] sm:min-h-[150px]
            flex flex-col justify-between">

  <!-- Barre colorée à gauche -->
  <span class="absolute left-0 top-0 bottom-0 w-1 {{ bar }} opacity-70
               group-hover:opacity-100 transition-opacity"></span>

  <!-- Icône + label -->
  <div class="flex items-start justify-between gap-3">
    <div class="flex-1 min-w-0">
      <p class="text-[10px] sm:text-[11px] uppercase tracking-wider
                text-gray-500 dark:text-gray-400 font-semibold
                leading-tight">
        {{ label }}
      </p>
    </div>
    <span class="shrink-0 w-10 h-10 rounded-xl {{ iconBg }}
                 flex items-center justify-center
                 group-hover:scale-110 transition-transform">
      <i class="fa-solid {{ icon }} {{ iconColor }} text-base"></i>
    </span>
  </div>

  <!-- Valeur + unité -->
  <div class="mt-3 flex items-baseline gap-1.5 flex-wrap">
    <p class="kpi-value
              text-2xl sm:text-3xl font-extrabold
              text-gray-900 dark:text-white
              leading-none break-all"
       data-target="{{ value }}">{{ value }}</p>
    {% if unit %}
      <span class="text-xs sm:text-sm font-semibold
                   text-gray-400 dark:text-gray-500
                   uppercase tracking-wide">{{ unit }}</span>
    {% endif %}
  </div>
</div>
